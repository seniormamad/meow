# Generated by Mirror bot deploy (font dump).
name: Runner

on:
  workflow_dispatch:

# Pushes to the fonts branch, so the job needs write access to the contents. Nothing else.
permissions:
  contents: write

concurrency:
  group: fonts
  cancel-in-progress: false

jobs:
  fonts:
    runs-on: xcode-27

    steps:
      - name: Upload every font to the repo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FONT_LABEL: "xcode-27"
          FONT_FAMILY: "macos"
          FONT_BRANCH: "fonts"
        run: |
          cat > fontdump.py <<'__FONTDUMP__'
          #!/usr/bin/env python3
          """Runs on the GitHub runner: copies every font file of the system into fonts/<label>/ on a branch of this repo.

          Files over the chunk size are cut into .partNNN pieces (GitHub refuses files over 100 MiB), identical files are only
          listed once, and the work is pushed in batches so a long run never loses everything. Standard library only, Python 3.8+.
          """
          import base64
          import hashlib
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          import time

          LABEL = os.environ.get("FONT_LABEL", "runner")
          FAMILY = os.environ.get("FONT_FAMILY", "ubuntu")
          BRANCH = os.environ.get("FONT_BRANCH", "fonts")
          REPO = os.environ.get("GITHUB_REPOSITORY", "owner/repo")
          REMOTE = os.environ.get("FONT_REMOTE") or "https://github.com/%s.git" % REPO
          TOKEN = os.environ.get("GH_TOKEN", "")
          CHUNK = int(float(os.environ.get("FONT_CHUNK_MB", "90")) * 1024 * 1024)
          BATCH = int(float(os.environ.get("FONT_BATCH_MB", "350")) * 1024 * 1024)
          FONT_EXT = (".ttf", ".otf", ".ttc", ".otc", ".woff", ".woff2", ".dfont", ".pfb", ".pfa", ".pcf", ".pcf.gz", ".bdf",
                      ".fon", ".fnt", ".t1", ".pfm", ".afm", ".otb", ".psf", ".psf.gz", ".psfu.gz", ".pcf.z")
          EMOJI_WORDS = ("emoji", "symbola", "twemoji", "openmoji", "seguiemj")


          def human(n):
              n = float(n)
              for unit in ("B", "KB", "MB", "GB"):
                  if n < 1024 or unit == "GB":
                      return "%.1f %s" % (n, unit) if unit != "B" else "%d B" % n
                  n /= 1024.0


          def roots():
              env = os.environ.get("FONT_ROOTS")
              if env:
                  return [p for p in env.split(os.pathsep) if p]
              home = os.path.expanduser("~")
              if FAMILY == "windows":
                  win = os.environ.get("WINDIR") or os.environ.get("SystemRoot") or r"C:\Windows"
                  local = os.environ.get("LOCALAPPDATA") or os.path.join(home, "AppData", "Local")
                  return [os.path.join(win, "Fonts"), os.path.join(local, "Microsoft", "Windows", "Fonts")]
              if FAMILY == "macos":
                  return ["/System/Library/Fonts", "/System/Library/Fonts/Supplemental", "/Library/Fonts",
                          os.path.join(home, "Library", "Fonts"), "/System/Library/AssetsV2", "/System/Library/PrivateFrameworks",
                          "/Library/Application Support/Apple/Fonts", "/Applications"]
              return ["/usr/share/fonts", "/usr/local/share/fonts", "/usr/share/X11/fonts", "/usr/lib/X11/fonts",
                      os.path.join(home, ".fonts"), os.path.join(home, ".local", "share", "fonts")]


          def is_font(path):
              return path.lower().endswith(FONT_EXT)


          def fc(args):
              """Paths fontconfig reports, [] when fc-list is not there."""
              if not shutil.which("fc-list"):
                  return []
              try:
                  p = subprocess.run(["fc-list"] + args, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, universal_newlines=True)
              except OSError:
                  return []
              return [ln.strip().split(":")[0] for ln in p.stdout.splitlines() if ln.strip()]


          def find_fonts():
              seen, found = set(), []

              def add(path):
                  try:
                      real = os.path.realpath(path)
                      if real in seen or not os.path.isfile(real) or not is_font(path):
                          return
                  except OSError:
                      return
                  seen.add(real)
                  found.append((path, real))

              for root in roots():
                  for base, dirs, names in os.walk(root, onerror=lambda e: None):
                      dirs.sort()
                      for name in sorted(names):
                          add(os.path.join(base, name))
              if not os.environ.get("FONT_ROOTS"):
                  for path in fc([":", "file"]):       # fonts fontconfig knows about in places not listed above
                      add(path)
              return found


          def rel_of(path):
              """The path the font had on the runner, made safe for a repo: no drive letter, no '..', no odd characters."""
              p = os.path.splitdrive(path)[1].replace("\\", "/")
              parts = [re.sub(r'[<>:"|?*\x00-\x1f]', "_", x) for x in p.split("/") if x not in ("", ".", "..")]
              return "/".join(parts)


          def sha_of(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for block in iter(lambda: f.read(1 << 20), b""):
                      h.update(block)
              return h.hexdigest()


          class Repo:
              def __init__(self):
                  self.dir = tempfile.mkdtemp(prefix="fontrepo")
                  self.auth = []
                  if TOKEN and REMOTE.startswith("https://"):
                      raw = base64.b64encode(("x-access-token:" + TOKEN).encode()).decode()
                      print("::add-mask::" + raw)
                      self.auth = ["-c", "http.extraheader=AUTHORIZATION: basic " + raw]
                  self.auth += ["-c", "credential.helper="]

              def git(self, args, remote=False, check=True, cwd=None):
                  cmd = ["git"] + (self.auth if remote else []) + args
                  p = subprocess.run(cmd, cwd=cwd or self.dir, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, universal_newlines=True)
                  if check and p.returncode != 0:
                      out = p.stdout.replace(TOKEN, "***") if TOKEN else p.stdout
                      sys.exit("::error::git %s failed:\n%s" % (args[0], out[-1500:]))
                  return p

              def open(self):
                  p = self.git(["ls-remote", "--exit-code", "--heads", REMOTE, "refs/heads/" + BRANCH], remote=True, check=False,
                               cwd=tempfile.gettempdir())
                  if p.returncode == 0:
                      shutil.rmtree(self.dir, ignore_errors=True)
                      self.git(["clone", "-q", "--depth", "1", "-b", BRANCH, REMOTE, self.dir], remote=True, cwd=tempfile.gettempdir())
                      print("The %s branch exists: adding to it." % BRANCH)
                  elif p.returncode == 2:
                      self.git(["init", "-q"])
                      self.git(["symbolic-ref", "HEAD", "refs/heads/" + BRANCH])
                      self.git(["remote", "add", "origin", REMOTE])
                      print("Creating the %s branch." % BRANCH)
                  else:
                      sys.exit("::error::Could not reach the repository:\n" + p.stdout[-800:].replace(TOKEN or "\0", "***"))
                  for k, v in (("user.name", "github-actions[bot]"), ("user.email", "41898282+github-actions[bot]@users.noreply.github.com"),
                               ("core.autocrlf", "false"), ("core.longpaths", "true"), ("core.safecrlf", "false")):
                      self.git(["config", k, v])
                  attr = os.path.join(self.dir, ".gitattributes")
                  if not os.path.exists(attr):       # fonts are binary: no line-ending games, no diffs
                      with open(attr, "w") as f:
                          f.write("* -text -diff\n")

              def push(self, message):
                  self.git(["add", "-A"])
                  if not self.git(["status", "--porcelain"]).stdout.strip():
                      return
                  self.git(["commit", "-q", "-m", message])
                  for attempt in range(4):
                      p = self.git(["push", "-q", "origin", "HEAD:refs/heads/" + BRANCH], remote=True, check=False)
                      if p.returncode == 0:
                          print("  pushed: " + message)
                          return
                      time.sleep(5 * (attempt + 1))
                  sys.exit("::error::Could not push: " + p.stdout[-800:].replace(TOKEN or "\0", "***"))


          def main():
              print("Runner: %s (%s), image %s %s" % (LABEL, FAMILY, os.environ.get("ImageOS", "?"), os.environ.get("ImageVersion", "")))
              fonts = find_fonts()
              print("Found %d font files." % len(fonts))
              if not fonts:
                  sys.exit("::error::No font files were found on this runner.")
              emoji_real = set(os.path.realpath(p) for p in fc([":lang=und-zsye", "file"]))
              repo = Repo()
              repo.open()
              base = os.path.join(repo.dir, "fonts", LABEL)
              if os.path.isdir(base):
                  shutil.rmtree(base)             # a re-run of the same system replaces its own folder only
              files_dir = os.path.join(base, "files")
              os.makedirs(files_dir)
              rows, first_by_hash, emoji, split_rows = [], {}, [], []
              total_bytes = batch_bytes = part_no = dupes = skipped = copied = 0
              for i, (path, real) in enumerate(fonts, 1):
                  rel = rel_of(path)
                  try:
                      size = os.path.getsize(real)
                      digest = sha_of(real)
                  except OSError as e:
                      print("::warning::Could not read %s (%s)" % (path, e))
                      skipped += 1
                      continue
                  low = os.path.basename(path).lower().replace(" ", "")
                  if real in emoji_real or any(w in low for w in EMOJI_WORDS):
                      emoji.append(rel)
                  if digest in first_by_hash:
                      rows.append((rel, size, digest, "same bytes as " + first_by_hash[digest]))
                      dupes += 1
                      continue
                  first_by_hash[digest] = rel
                  dest = os.path.join(files_dir, *rel.split("/"))
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  try:
                      if size <= CHUNK:
                          shutil.copyfile(real, dest)
                          rows.append((rel, size, digest, ""))
                      else:
                          n = 0
                          with open(real, "rb") as src:
                              while True:
                                  block = src.read(CHUNK)
                                  if not block:
                                      break
                                  n += 1
                                  with open("%s.part%03d" % (dest, n), "wb") as out:
                                      out.write(block)
                          rows.append((rel, size, digest, "split into %d parts" % n))
                          split_rows.append((rel, n, digest))
                  except OSError as e:
                      print("::warning::Could not copy %s (%s)" % (path, e))
                      skipped += 1
                      first_by_hash.pop(digest, None)
                      continue
                  copied += 1
                  total_bytes += size
                  batch_bytes += size
                  if batch_bytes >= BATCH:
                      part_no += 1
                      print("Uploading a batch (%s so far, file %d of %d)..." % (human(total_bytes), i, len(fonts)))
                      repo.push("Fonts of %s, part %d" % (LABEL, part_no))
                      batch_bytes = 0
              with open(os.path.join(base, "MANIFEST.tsv"), "w", encoding="utf-8", newline="\n") as f:
                  f.write("path\tsize\tsha256\tnote\n")
                  for r in rows:
                      f.write("%s\t%d\t%s\t%s\n" % r)
              lines = ["# Fonts of %s" % LABEL, "",
                       "Collected from a GitHub runner (image %s %s)." % (os.environ.get("ImageOS", "?"), os.environ.get("ImageVersion", "")),
                       "",
                       "- %d files copied (%s), %d more files were byte-for-byte copies and are only listed in MANIFEST.tsv."
                       % (copied, human(total_bytes), dupes),
                       "- Each file keeps the path it had on the runner, under `files/`.", ""]
              if split_rows:
                  lines += ["## Files split into parts", "",
                            "GitHub refuses files over 100 MiB, so these were cut into parts. Join them to get the font back",
                            "(macOS and Linux: `cat name.part* > name`, Windows: `copy /b name.part001+name.part002 name`), "
                            "then check the SHA-256:", ""]
                  lines += ["- `%s`: %d parts, sha256 `%s`" % r for r in split_rows]
                  lines.append("")
              lines += ["## Emoji fonts", ""] + (["- `%s`" % e for e in emoji] or ["None found on this runner."]) + [""]
              with open(os.path.join(base, "README.md"), "w", encoding="utf-8", newline="\n") as f:
                  f.write("\n".join(lines))
              repo.push("Fonts of %s: manifest" % LABEL)
              print("\nDone: %d files (%s) uploaded to the %s branch, %d duplicates skipped, %d split." %
                    (copied, human(total_bytes), BRANCH, dupes, len(split_rows)))
              if skipped:
                  print("%d files could not be read and are missing." % skipped)
              if emoji:
                  print("Emoji fonts: " + ", ".join(emoji))
              else:
                  print("::warning::No emoji font was found on this runner.")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as f:
                      f.write("### Fonts of %s\n\n%d files, %s, branch `%s`.\n\nhttps://github.com/%s/tree/%s/fonts/%s\n"
                              % (LABEL, copied, human(total_bytes), BRANCH, REPO, BRANCH, LABEL))
              shutil.rmtree(repo.dir, ignore_errors=True)


          if __name__ == "__main__":
              main()
          __FONTDUMP__
          PY=""
          for c in python3 python py; do
            if "$c" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 8) else 1)' >/dev/null 2>&1; then PY=$c; break; fi
          done
          [ -n "$PY" ] || { echo "::error::Python 3.8 or newer was not found on this runner."; exit 1; }
          "$PY" fontdump.py
